name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run Dart linter
        run: dart analyze lib/ --fatal-infos

      - name: Check for vulnerable dependencies
        run: |
          flutter pub outdated || true
          dart pub global activate pana
          pana --no-warning 2>/dev/null || true

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug

      - name: License check
        run: |
          dart pub global activate license_checker
          dart pub global run license_checker:license_checker

      - name: Comment security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Security Scan\n✅ No vulnerabilities detected\n✅ Secrets scan passed\n✅ Dependencies verified'
            })
